[project]
name = "qadam-api"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "pyjwt[crypto]>=2.10,<3", "tzdata>=2025.1",
]
[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: needs an empty dedicated TEST_DATABASE_URL"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
